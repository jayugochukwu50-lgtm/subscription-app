<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <span class="logo big">S</span>
      <h1>Admin sign in</h1>
      <p class="muted">Enter your admin key to view customers, plans and transactions.</p>
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
      <p id="loginError" class="login-error"></p>
      <button id="loginBtn" class="primary" type="submit">Sign in</button>
    </form>
  </div>

  <header class="top">
    <div class="brand"><span class="logo">S</span> Subscription Admin</div>
    <div class="top-right">
      <span class="badge test">Test mode</span>
      <button id="signout" class="ghost" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats"></section>
<section class="card chart-card"><div class="chart-head"><h2>Revenue</h2><span class="muted">Last 14 days</span></div><div id="chart"></div></section>

    <nav class="tabs">
      <button class="tab active" data-tab="transactions">Transactions</button>
      <button class="tab" data-tab="customers">Customers</button>
      <button class="tab" data-tab="plans">Plans</button>
    </nav>

    <div class="card">
      <div class="scroll"><table id="table"></table></div>
    </div>
  </main>

  <script src="/chart.js"></script>
  <script src="/app.js"></script>
</body>
</html>
